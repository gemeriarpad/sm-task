; Queue workers for /etc/supervisor/conf.d/. Adjust the path and user to the server.
;
; Two workers, so one long sync (up to 30 minutes with cloning) doesn't hold up the
; other targets or the queue heartbeat. The job's own $tries and $timeout apply; the
; flags below recycle each worker hourly or at 256 MB to keep memory flat.
[program:sm-task-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sm-task/artisan queue:work database --queue=default --sleep=3 --max-time=3600 --memory=256 --timeout=1800
directory=/var/www/sm-task
user=www-data
numprocs=2
autostart=true
autorestart=true
; Stopping (deploys, `queue:restart`) lets a worker finish its current job first: wait
; longer than the longest job (SyncTargetRepositories: 1800 s) before killing it.
stopwaitsecs=1860
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/sm-task/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
