; Optional: the Reverb WebSocket server for live page updates. Without it the pages
; poll while a sync runs. Put it behind the web server's TLS proxy (REVERB_HOST/PORT).
[program:sm-task-reverb]
command=php /var/www/sm-task/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/sm-task
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/sm-task/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
